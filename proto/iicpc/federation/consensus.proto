syntax = "proto3";

package iicpc.federation;

option go_package = "github.com/iicpc/platform/gen/go/iicpc/federation";

import "iicpc/common/health.proto";
import "iicpc/common/metrics.proto";

// Raft consensus messages
message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  enum EntryType {
    ENTRY_TYPE_UNSPECIFIED = 0;
    COMMAND = 1;
    CONFIGURATION = 2;
    SNAPSHOT = 3;
  }
  EntryType type = 3;
  bytes data = 4;
  int64 timestamp_ns = 5;
}

// Install snapshot request/response
message InstallSnapshotRequest {
  int64 term = 1;
  string leader_id = 2;
  SnapshotMetadata metadata = 3;
  bytes data = 4;
  bool done = 5;
}

message InstallSnapshotResponse {
  int64 term = 1;
  bool success = 2;
}

message SnapshotMetadata {
  int64 last_included_index = 1;
  int64 last_included_term = 2;
  map<string, string> configuration = 3;
}

// Consensus service
service Consensus {
  // RequestVote RPC
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  
  // AppendEntries RPC
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  
  // InstallSnapshot RPC
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  
  // Health check
  rpc Health(iicpc.common.HealthCheckRequest) returns (iicpc.common.HealthCheckResponse);
  
  // Metrics
  rpc Metrics(iicpc.common.MetricsRequest) returns (iicpc.common.MetricsResponse);
  
  // Get node status
  rpc GetNodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
}

message NodeStatusRequest {
  string node_id = 1;
}

message NodeStatusResponse {
  string node_id = 1;
  enum NodeState {
    NODE_STATE_UNSPECIFIED = 0;
    FOLLOWER = 1;
    CANDIDATE = 2;
    LEADER = 3;
  }
  NodeState state = 2;
  int64 term = 3;
  int64 commit_index = 4;
  int64 last_applied = 5;
  string leader_id = 6;
  repeated PeerStatus peers = 7;
}

message PeerStatus {
  string peer_id = 1;
  int64 match_index = 2;
  int64 next_index = 3;
  bool healthy = 4;
  int64 last_contact_ns = 5;
}