syntax = "proto3";

package iicpc.evaluation;

option go_package = "github.com/iicpc/platform/gen/go/iicpc/evaluation";

import "iicpc/common/health.proto";
import "iicpc/common/metrics.proto";

// Telemetry event from evaluation runs
message TelemetryEvent {
  string run_id = 1;
  int64 timestamp_ns = 2;
  
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    ORDER_SUBMITTED = 1;
    ORDER_ACKNOWLEDGED = 2;
    ORDER_REJECTED = 3;
    ORDER_FILLED = 4;
    ORDER_CANCELLED = 5;
    ORDER_REPLACED = 6;
    MARKET_DATA = 7;
    HEARTBEAT = 8;
    ERROR = 9;
  }
  EventType type = 3;
  
  // Order details
  string order_id = 4;
  string instrument = 5;
  string side = 6;
  int64 quantity = 7;
  double price = 8;
  int64 latency_ns = 9;
  
  // Fill details
  int64 filled_quantity = 10;
  double filled_price = 11;
  
  // Error details
  string error_code = 12;
  string error_message = 13;
  
  // Labels for filtering
  map<string, string> labels = 14;
}

// Telemetry batch for efficient streaming
message TelemetryBatch {
  string run_id = 1;
  int64 batch_id = 2;
  int64 timestamp_ns = 3;
  repeated TelemetryEvent events = 4;
}

// Aggregated telemetry for scoring
message TelemetryAggregates {
  string run_id = 1;
  int64 window_start_ns = 2;
  int64 window_end_ns = 3;
  
  // Latency percentiles (nanoseconds)
  int64 p50_latency_ns = 4;
  int64 p90_latency_ns = 5;
  int64 p99_latency_ns = 6;
  int64 p999_latency_ns = 7;
  double latency_stddev_ns = 8;
  double latency_mean_ns = 9;
  
  // Throughput
  double sustained_tps = 10;
  double peak_tps = 11;
  
  // Correctness
  double error_rate = 12;
  int64 total_orders = 13;
  int64 successful_orders = 14;
  int64 rejected_orders = 15;
  int64 validation_errors = 16;
  
  // Chaos
  int64 chaos_events_handled = 17;
  int64 chaos_events_total = 18;
  
  // Fingerprint
  string fingerprint = 19;
}

// Telemetry service
service Telemetry {
  // Submit telemetry events (batch)
  rpc SubmitTelemetry(TelemetryBatch) returns (TelemetryResponse);
  
  // Stream telemetry events
  rpc StreamTelemetry(stream TelemetryBatch) returns (TelemetryResponse);
  
  // Get aggregated telemetry for a run
  rpc GetAggregates(GetAggregatesRequest) returns (TelemetryAggregates);
  
  // Stream real-time aggregates
  rpc StreamAggregates(GetAggregatesRequest) returns (stream TelemetryAggregates);
  
  // Health check
  rpc Health(iicpc.common.HealthCheckRequest) returns (iicpc.common.HealthCheckResponse);
  
  // Metrics
  rpc Metrics(iicpc.common.MetricsRequest) returns (iicpc.common.MetricsResponse);
}

message TelemetryResponse {
  bool success = 1;
  int64 events_accepted = 2;
  string error = 3;
}

message GetAggregatesRequest {
  string run_id = 1;
  int64 window_start_ns = 2;
  int64 window_end_ns = 3;
}