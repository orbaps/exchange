syntax = "proto3";

package iicpc.common;

option go_package = "github.com/iicpc/platform/gen/go/iicpc/common";

// Health check service for all platform components
service Health {
  // Synchronous health check
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Streaming health check for real-time monitoring
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}

// Request for health check
message HealthCheckRequest {
  string service = 1;  // Service name to check (empty = all)
}

// Response with health status
message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  
  string service = 1;
  ServingStatus status = 2;
  string message = 3;
  int64 timestamp_ns = 4;
  map<string, string> details = 5;
}