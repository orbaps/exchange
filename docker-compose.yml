services:
  # ── Infrastructure ────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:2-pg16
    environment:
      POSTGRES_DB: iicpc
      POSTGRES_USER: iicpc
      POSTGRES_PASSWORD: iicpc-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iicpc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ──────────────────────────────────────────────
  hosting:
    build:
      context: .
      dockerfile: iac/docker/Dockerfile.hosting
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql+asyncpg://iicpc:iicpc-dev@postgres:5432/iicpc
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_PORT: 50051
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: development
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }

  botfleet:
    build:
      context: .
      dockerfile: iac/docker/Dockerfile.botfleet
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RESULTS_TOPIC: botfleet.results
      FLEET_CONFIG_PATH: /config/fleet-config.json
    depends_on:
      kafka: { condition: service_healthy }

  evaluation:
    build:
      context: .
      dockerfile: iac/docker/Dockerfile.evaluation
    ports:
      - "8001:8001"
      - "50052:50052"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_PORT: 50052
    depends_on:
      kafka: { condition: service_healthy }

  federation:
    build:
      context: .
      dockerfile: iac/docker/Dockerfile.federation
    ports:
      - "8002:8002"
      - "50053:50053"
    environment:
      GRPC_PORT: 50053
      PEER_NODES: federation:50053

  governance:
    build:
      context: .
      dockerfile: iac/docker/Dockerfile.governance
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://iicpc:iicpc-dev@postgres:5432/iicpc
    depends_on:
      postgres: { condition: service_healthy }

  strategic:
    build:
      context: .
      dockerfile: iac/docker/Dockerfile.strategic
    ports:
      - "8004:8004"

  dashboard:
    build:
      context: .
      dockerfile: iac/docker/Dockerfile.dashboard
    ports:
      - "8080:8080"

  # ── Monitoring ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./iac/helm/iicpc-platform/templates/prometheus-deployment.yaml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  kafkadata:
