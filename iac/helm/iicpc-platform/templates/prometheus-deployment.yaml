{{- if .Values.prometheus.enabled }}
# Prometheus statefulset
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "iicpc.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "iicpc.fullname" . }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image }}"
          imagePullPolicy: "IfNotPresent"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/data"
            - "--web.console.libraries=/etc/prometheus/console_libraries"
            - "--web.console.templates=/etc/prometheus/consoles"
            - "--web.enable-admin-api"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: {{ include "iicpc.fullname" . }}-prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: {{ include "iicpc.fullname" . }}-prometheus-pvc

---
# PersistentVolumeClaim for Prometheus
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "iicpc.fullname" . }}-prometheus-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.prometheus.storageSize | default "30Gi" }}
  storageClassName: {{ .Values.prometheus.storageClass | default "standard" }}

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iicpc.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
  selector:
    app: prometheus
{{- end }}
