# Ingress resources for services with ingress enabled
{{- $fullname := include "iicpc.fullname" . }}
{{- range $service, $config := .Values }}
{{- if and (kindIs "map" $config) $config.ingress $config.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-{{ $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "iicpc.labels" $ | nindent 4 }}
    app: {{ $service }}
  annotations:
    {{- if $config.ingress.annotations }}
    {{- range $key, $value := $config.ingress.annotations }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
    {{- end }}
    {{- if $config.ingress.className }}
    kubernetes.io/ingress.class: {{ $config.ingress.className }}
    {{- end }}
spec:
  {{- if $config.ingress.tls }}
  tls:
    {{- range $config.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $config.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullname }}-{{ $service }}
                port:
                  {{- if (first $config.service.ports).name }}
                  name: {{ (first $config.service.ports).name }}
                  {{- else }}
                  number: {{ (first $config.service.ports).port }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
