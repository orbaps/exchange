# NetworkPolicies for service-to-service security
{{- $fullname := include "iicpc.fullname" . }}
{{- $namespace := .Release.Namespace }}

# Default deny-all ingress policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow ingress-nginx to access all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-ingress-nginx
  namespace: {{ $namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingress-nginx
      ports:
        - port: 8000
        - port: 8001
        - port: 8002
        - port: 8003
        - port: 8080
        - port: 3000

---
# Allow inter-service gRPC communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-grpc
  namespace: {{ $namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
      ports:
        - port: 50051
        - port: 50052
        - port: 50053

---
# Allow Kafka access from application services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-kafka
  namespace: {{ $namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
      ports:
        - port: 9092

---
# Allow PostgreSQL access from application services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-postgresql
  namespace: {{ $namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
