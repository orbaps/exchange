# Secret for IICPC Platform
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iicpc.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
type: Opaque
data:
  # Database credentials
  POSTGRES_PASSWORD: {{ .Values.secrets.iicpc.stringData.POSTGRES_PASSWORD | b64enc }}
  REDIS_PASSWORD: {{ .Values.secrets.iicpc.stringData.REDIS_PASSWORD | b64enc }}
  KAFKA_SASL_PASSWORD: {{ .Values.secrets.iicpc.stringData.KAFKA_SASL_PASSWORD | b64enc }}
  TIMESCALEDB_PASSWORD: {{ .Values.secrets.iicpc.stringData.TIMESCALEDB_PASSWORD | b64enc }}
  GRAFANA_PASSWORD: {{ .Values.secrets.iicpc.stringData.GRAFANA_PASSWORD | b64enc }}

# TLS certificates (if needed)
{{- if .Values.tls }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ include "iicpc.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
data:
  tls.crt: {{ .Values.tls.cert | b64enc }}
  tls.key: {{ .Values.tls.key | b64enc }}
{{- end }}