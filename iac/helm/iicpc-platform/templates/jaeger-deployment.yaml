{{- if .Values.jaeger.enabled }}
# Jaeger deployment (distributed tracing UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iicpc.fullname" . }}-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jaeger.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: "{{ .Values.jaeger.image }}"
          imagePullPolicy: "IfNotPresent"
          env:
            - name: SPAN_STORAGE_TYPE
              value: "badger"
            - name: BADGER_EPHEMERAL
              value: "true"
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: jaeger-data
              mountPath: /tmp/jaeger
      volumes:
        - name: jaeger-data
          emptyDir: {}

---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iicpc.fullname" . }}-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
    app: jaeger
spec:
  type: ClusterIP
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
  selector:
    app: jaeger
{{- end }}
