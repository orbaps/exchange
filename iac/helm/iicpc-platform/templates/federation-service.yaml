# Federation service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iicpc.fullname" . }}-federation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
    app: federation
spec:
  type: {{ .Values.federation.service.type }}
  ports:
    - name: raft
      port: 50052
      targetPort: raft
      protocol: TCP
    - name: metrics
      port: 50053
      targetPort: metrics
      protocol: TCP
  selector:
    app: federation