# Governance service deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iicpc.fullname" . }}-governance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
    app: governance
spec:
  replicas: {{ .Values.governance.replicaCount }}
  selector:
    matchLabels:
      app: governance
  template:
    metadata:
      labels:
        app: governance
      annotations:
        kubectl.kubernetes.io/default-container: "governance"
    spec:
      serviceAccountName: {{ include "iicpc.serviceAccountName" . }}
      imagePullSecrets:
        {{- include "iicpc.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: governance
          image: "{{ .Values.governance.image.repository }}:{{ .Values.governance.image.tag }}"
          imagePullPolicy: {{ .Values.governance.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            {{- range .Values.governance.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: "{{ .value }}"
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: logs
              mountPath: /var/log/governance
      volumes:
        - name: logs
          emptyDir:
            medium: Memory