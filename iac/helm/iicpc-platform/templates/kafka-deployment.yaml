{{- if .Values.kafka.enabled }}
# Kafka statefulset
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "iicpc.fullname" . }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "iicpc.fullname" . }}-kafka
  replicas: {{ .Values.kafka.replicas | default 3 }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image }}"
          imagePullPolicy: "IfNotPresent"
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ include "iicpc.fullname" . }}-kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: "/opt/kafka/data"
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          volumeMounts:
            - name: kafka-data
              mountPath: /opt/kafka/data
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: {{ include "iicpc.fullname" . }}-kafka-pvc

---
# PersistentVolumeClaim for Kafka
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "iicpc.fullname" . }}-kafka-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.kafka.persistence.size }}
  storageClassName: {{ .Values.kafka.persistence.storageClass }}

---
# Kafka Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iicpc.fullname" . }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
    app: kafka
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
      protocol: TCP
  selector:
    app: kafka
{{- end }}
