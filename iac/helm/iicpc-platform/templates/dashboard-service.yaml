# Dashboard service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iicpc.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iicpc.labels" . | nindent 4 }}
    app: dashboard
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: dashboard