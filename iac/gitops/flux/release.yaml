apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: iicpc-platform
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: iac/helm/iicpc-platform
      sourceRef:
        kind: GitRepository
        name: iicpc-platform
  valuesFrom:
    - kind: ConfigMap
      name: iicpc-values
      optional: true
