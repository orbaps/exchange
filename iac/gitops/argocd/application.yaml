apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iicpc-platform
  namespace: argocd
spec:
  project: iicpc-platform
  source:
    repoURL: https://github.com/orbaps/exchange
    targetRevision: HEAD
    path: iac/helm/iicpc-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: iicpc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
