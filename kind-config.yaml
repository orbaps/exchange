# Kind Cluster Configuration for IICPC Platform
# Local Kubernetes development cluster with 4 nodes:
# - 1 control plane (with ingress ports)
# - 3 workers with workload labels for scheduling

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Disable default CNI to use our own (kindnetd is fine for local)
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/12"
  # API server address
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443

nodes:
  # Control plane node with ingress ports mapped
  - role: control-plane
    image: kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=control,node.kubernetes.io/exclude-from-external-load-balancers=true"
            eviction-hard: "memory.available<100Mi,nodefs.available<10%"
            eviction-soft: "memory.available<500Mi,nodefs.available<15%"
            eviction-soft-grace-period: "memory.available=1m30s,nodefs.available=2m"
    extraPortMappings:
      # HTTP Ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS Ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # gRPC Ingress (if using different port)
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Grafana
      - containerPort: 3000
        hostPort: 3000
        protocol: TCP
      # Prometheus
      - containerPort: 9090
        hostPort: 9090
        protocol: TCP
      # Kafka (external access)
      - containerPort: 30092
        hostPort: 30092
        protocol: TCP
      # PostgreSQL/TimescaleDB
      - containerPort: 30432
        hostPort: 30432
        protocol: TCP
      # Redis
      - containerPort: 30379
        hostPort: 30379
        protocol: TCP

  # Worker 1: General workloads (hosting, evaluation, governance, strategic)
  - role: worker
    image: kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245
    labels:
      workload: general
      node-type: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=general"
            eviction-hard: "memory.available<100Mi,nodefs.available<10%"
            eviction-soft: "memory.available<500Mi,nodefs.available<15%"

  # Worker 2: Bot fleet workloads (high CPU, burstable)
  - role: worker
    image: kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245
    labels:
      workload: botfleet
      node-type: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=botfleet"
            eviction-hard: "memory.available<100Mi,nodefs.available<10%"
            eviction-soft: "memory.available<500Mi,nodefs.available<15%"

  # Worker 3: Federation/stateful workloads (consensus, replication)
  - role: worker
    image: kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245
    labels:
      workload: federation
      node-type: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=federation"
            eviction-hard: "memory.available<100Mi,nodefs.available<10%"
            eviction-soft: "memory.available<500Mi,nodefs.available<15%"

# Feature gates for advanced features
featureGates:
  # Enable ephemeral containers for debugging
  EphemeralContainers: true
  # Enable pod resource claims
  PodResourceClaims: true
  # Enable dynamic resource allocation
  DynamicResourceAllocation: true