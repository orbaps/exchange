name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  multi-arch-build:
    name: Build & Push Multi-Arch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - hosting
          - botfleet
          - evaluation
          - federation
          - governance
          - strategic
          - dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: iac/docker/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/iicpc-${{ matrix.service }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository }}/iicpc-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-package:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: multi-arch-build
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Package Helm chart
        run: |
          helm package iac/helm/iicpc-platform --destination ./.chart-release
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./.chart-release/*.tgz

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [multi-arch-build, helm-package]
    steps:
      - uses: actions/checkout@v4
      - name: Generate release notes
        id: notes
        run: |
          echo "## What's Changed" > release-notes.md
          git log $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD \
            --oneline --no-decorate | while read line; do echo "- $line"; done >> release-notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            ./.chart-release/*.tgz
          generate_release_notes: false
