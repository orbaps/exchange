name: CD

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - hosting
          - botfleet
          - evaluation
          - federation
          - governance
          - strategic
          - dashboard
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: iac/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/iicpc-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/iicpc-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-kind:
    name: Deploy to Kind (Dev)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: iicpc-dev
          config: kind-config.yaml
      - name: Load images into Kind
        run: |
          for service in hosting botfleet evaluation federation governance strategic dashboard; do
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/iicpc-$service:${{ env.IMAGE_TAG }}
            kind load docker-image ${{ env.REGISTRY }}/${{ github.repository }}/iicpc-$service:${{ env.IMAGE_TAG }} --name iicpc-dev
          done
      - name: Deploy Helm chart
        run: |
          helm upgrade --install iicpc-dev iac/helm/iicpc-platform \
            --values iac/helm/iicpc-platform/values-kind.yaml \
            --set global.imageTag=${{ env.IMAGE_TAG }} \
            --wait --timeout 10m
      - name: Verify deployment
        run: |
          kubectl get pods -A
          kubectl get services -A

  deploy-oracle:
    name: Deploy to Oracle Cloud (Staging)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: false  # Disabled until Oracle Cloud credentials are configured
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Configure kubectl for OKE
        run: |
          echo "${{ secrets.OKE_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Deploy Helm chart
        run: |
          helm upgrade --install iicpc-staging iac/helm/iicpc-platform \
            --values iac/helm/iicpc-platform/values-oracle.yaml \
            --set global.imageTag=${{ env.IMAGE_TAG }} \
            --wait --timeout 15m
      - name: Verify deployment
        run: kubectl get pods -A
